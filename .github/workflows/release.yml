name: Release

# Builds the Python package's wheels and source distribution, and publishes them to PyPI when a
# `v<version>` tag is pushed (run by hand, it only builds them).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # replaces `.cargo/config.toml`'s `target-cpu=native`: wheels must run on any CPU of their target
  RUSTFLAGS: -C strip=symbols

jobs:
  wheels:
    name: Wheels (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and macOS only: the cache relies on Unix file permissions
        include:
          - { os: ubuntu-latest, target: x86_64, test: true }
          - { os: ubuntu-latest, target: aarch64, test: false }
          - { os: macos-latest, target: aarch64, test: true }
          - { os: macos-latest, target: x86_64, test: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # one abi3 wheel per platform serves every Python from 3.9 on
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --out dist
      - name: Test the wheel
        if: matrix.test
        run: |
          pip install python/dist/*.whl pytest networkx scipy
          pytest python/tests
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: python/dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the package's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' python/Cargo.toml | head -1)
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || {
            echo "tag ${GITHUB_REF_NAME} doesn't match python/Cargo.toml's version ${version}"
            exit 1
          }
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    # PyPI trusted publishing: no token, PyPI trusts this workflow in this environment
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

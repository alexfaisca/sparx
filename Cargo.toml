[package]
# published as `sparx-graph` (`sparx` is taken on crates.io), used as `sparx` (see `[lib]`)
name = "sparx-graph"
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
description = "Memory-mapped analytics for large static sparse graphs (de Bruijn graphs in particular): k-cores, k-trusses, triangles, communities (Louvain, Leiden, label propagation, spectral clustering), weighted shortest paths, centralities, Euler trails"
repository = "https://github.com/alexfaisca/sparx"
readme = "README.md"
keywords = ["graph", "sparse", "de-bruijn", "k-truss", "centrality"]
categories = ["algorithms", "data-structures", "science"]
license = "Apache-2.0"
include = [
    "/src/**/*",
    "/examples/**/*",
    "/tests/fixtures/**/*",
    "/README.md",
    "/LICENSE",
    "/Cargo.toml",
]

[lib]
name = "sparx"

# the benchmarking CLI (`cargo run --features cli`, or `bench`): kept out of library builds, so that
# depending on the crate doesn't compile its argument parser
[[bin]]
name = "sparx"
path = "src/main.rs"
required-features = ["cli"]

[package.metadata.docs.rs]
# the optional APIs documented too (not `bench`, which makes internal methods public, nor `gpu`,
# not documented yet)
features = ["rayon", "petgraph", "rustworkx"]

[workspace]
members = ["xtask", ".", "python"]

[profile.bench_cache]
inherits = "dev"  # or "dev"
debug = 2         # generate full debuginfo
strip = false     # ensure it isn't stripped after build
opt-level = 3
lto = "thin"
codegen-units = 1

[features]
default = ["mtx", "ggcat", "nodes_edges"]
# the benchmarking CLI (`src/main.rs`)
cli = ["dep:clap"]
# benchmarking hooks (internal methods public), and the CLI's benchmarking profiles
bench = ["cli", "dep:dashmap", "dep:once_cell"]
mtx = []
ggcat = []
nodes_edges = []
iter_with_offset = []
rayon = ["dep:rayon"]
# GPU compute backend (wgpu: Vulkan/Metal/DX12) --- currently HyperBall
gpu = ["dep:wgpu", "dep:pollster"]
# exports to petgraph's and rustworkx's graphs
petgraph = ["dep:petgraph"]
rustworkx = ["dep:rustworkx-core"]

[dependencies]
bytemuck = { version = "1.23.0", features = ["derive"] }
clap = { version = "4.5.39", features = ["derive"], optional = true }
lz4 = "1.24.0"
memmap2 = "0.9.7"
rand = "0.9.1"
static_assertions = "1.1.0"
fst = "0.4"
regex = "1"
glob = "0.3.2"
crossbeam = "0.8.4"
ordered-float = "5.0.0"
rand_distr = "0.5.1"
num_cpus = "1.17.0"
sys-info = "0.9.1"
sha2 = "0.10.9"
portable-atomic = { version = "1.11.1", features = ["float"] }
rustworkx-core = { version = "0.16.0", optional = true }
petgraph = { version = "0.8.2", optional = true }
memchr = "2.7"
rayon = { version = "1.11.0", optional = true }
wgpu = { version = "30.0.1", optional = true }
pollster = { version = "0.4.0", optional = true }
dashmap = { version = "6.1.0", optional = true }
once_cell = { version = "1.21.3", optional = true }

[dev-dependencies]
# (tests' helpers: `test_common`, `graph::test_utils`)
dashmap = "6.1.0"
once_cell = "1.21.3"
paste = "1.0.15"

[[example]]
name = "hyperball_timing"
required-features = ["bench"]

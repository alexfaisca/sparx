[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "sparx-graph"
description = "Memory-mapped analytics for large static sparse graphs: k-cores, k-trusses, triangles, communities (Louvain, Leiden, label propagation, spectral), shortest paths, centralities"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.21"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest", "networkx", "scipy"]

[project.urls]
Repository = "https://github.com/alexfaisca/sparx"

[tool.maturin]
module-name = "sparx._sparx"
python-source = "."
features = ["pyo3/extension-module"]
